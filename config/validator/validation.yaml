App\Entity\Location:
    constraints:
        - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity:
            fields: [city, country]
            errorPath: city
            groups: [create]
    properties:
        city:
            - NotBlank:
                groups: [create, edit]
            - Length:
                min: 2
                max: 255
                groups: [create, edit]
        country:
            - NotBlank:
                groups: [create, edit]
            - Country:
                groups: [create, edit]
        latitude:
            - NotBlank:
                groups: [create, edit]
            - Range:
                min: -90
                max: 90
                groups: [create, edit]
        longitude:
            - NotBlank:
                groups: [create, edit]
            - Range:
                min: -180
                max: 180
                groups: [create, edit]
App\Entity\Measurement:
    properties:
        location:
            - NotBlank:
                groups: [create, edit]
        date:
            - NotBlank:
                groups: [create, edit]
            - GreaterThanOrEqual:
                value: today
                message: The forecast date cannot be in the past.
                groups: [create]
        celsius:
            - NotBlank:
                groups: [create, edit]
            - Range:
                min: -60
                max: 60
                groups: [create, edit]
        humidity:
            - NotBlank:
                groups: [create, edit]
            - Range:
                min: 0
                max: 100
                groups: [create, edit]
        pressure:
            - NotBlank:
                groups: [create, edit]
            - Range:
                min: 900
                max: 1100
                groups: [create, edit]
        cloudiness:
            - NotBlank:
                groups: [create, edit]
            - Range:
                min: 0
                max: 100
                groups: [create, edit]
        precipitation:
            - NotBlank:
                groups: [create, edit]
            - PositiveOrZero:
                groups: [create, edit]
        windSpeed:
            - NotBlank:
                groups: [create, edit]
            - PositiveOrZero:
                groups: [create, edit]
        windDirection:
            - NotBlank:
                groups: [create, edit]
            - Range:
                min: 0
                max: 359
                groups: [create, edit]